<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart-Locker Delivery Confirmation</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #008080;
      --accent-color: #FFD700;
    }

    body {
      background-color: #f8f9fa;
      padding-top: 40px;
      padding-bottom: 40px;
    }

    .delivery-container {
      max-width: 700px;
      margin: auto;
      background-color: white;
      border-left: 20px solid var(--primary-color);
      border-right: 20px solid var(--accent-color);
      border-radius: 8px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
      padding: 2rem;
    }

    .delivery-container h2 {
      color: var(--primary-color);
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
    }

    .form-label {
      color: var(--primary-color);
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .form-control {
      border: 2px solid var(--primary-color);
      border-radius: 4px;
      padding: 0.75rem;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(0, 128, 128, 0.25);
    }

    .btn-submit {
      background-color: var(--accent-color);
      color: var(--primary-color);
      font-weight: 600;
      border: none;
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.75rem;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #FFD700;
      color: var(--primary-color);
    }

    .confirmation {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 2px solid var(--primary-color);
      color: var(--primary-color);
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="delivery-container">
      <h2>Delivery Confirmation</h2>
      <form id="deliveryForm">
        <div class="mb-3">
          <label for="driverName" class="form-label">Driver's Name</label>
          <input type="text" class="form-control" id="driverName" name="driverName" value="Mrs GroupSeven" readonly required>
        </div>

        <div class="mb-3">
          <label for="carModel" class="form-label">Car Model</label>
          <input type="text" class="form-control" id="carModel" name="carModel" value="Toyoal Corollar 2023 ABC123FS" readonly required>
        </div>

        <div class="mb-3">
          <label for="orderId" class="form-label">Order ID</label>
          <select class="form-control" id="orderId" name="orderId" required>
            <option value="">Select an order number</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">OK</button>
      </form>

      <div class="confirmation" id="confirmationMessage" style="display:none;"></div>
    </div>
  </div>

  <script>
    const ORDER_STORAGE_KEY = 'submittedOrders';
    const SYSTEM_UPDATES_KEY = 'systemUpdates';
    const DRIVER_NAMES_KEY = 'deliveryDriverNames';
    const CAR_MODELS_KEY = 'deliveryCarModels';

    function getSubmittedOrders() {
      return JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || '[]');
    }

    function setSubmittedOrders(orders) {
      localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(orders));
    }

    function getStoredList(key) {
      return JSON.parse(localStorage.getItem(key) || '[]');
    }

    function saveUniqueValue(key, value) {
      const list = getStoredList(key);
      if (!list.includes(value)) {
        list.unshift(value);
        localStorage.setItem(key, JSON.stringify(list));
      }
    }

    function populateOrderDropdown() {
      const orderSelect = document.getElementById('orderId');
      const orders = getSubmittedOrders();
      orderSelect.innerHTML = '<option value="">Select an order number</option>';

      orders.forEach((order) => {
        const option = document.createElement('option');
        option.value = order.orderNo;
        option.textContent = `${order.orderNo} (${order.date || 'No date'})`;
        orderSelect.appendChild(option);
      });
    }

    document.getElementById('deliveryForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const driverName = document.getElementById('driverName').value.trim();
      const carModel = document.getElementById('carModel').value.trim();
      const orderId = document.getElementById('orderId').value;

      if (!orderId) {
        alert('Please select an Order ID.');
        return;
      }

      const remainingOrders = getSubmittedOrders().filter((order) => order.orderNo !== orderId);
      setSubmittedOrders(remainingOrders);
      saveUniqueValue(DRIVER_NAMES_KEY, driverName);
      saveUniqueValue(CAR_MODELS_KEY, carModel);

      const systemMessage = `Order #${orderId} completed: delivered by ${driverName} using ${carModel}.`;
      const storedLogs = JSON.parse(localStorage.getItem(SYSTEM_UPDATES_KEY) || '[]');
      storedLogs.push({
        type: 'completed',
        message: systemMessage,
        timestamp: new Date().toISOString()
      });
      localStorage.setItem(SYSTEM_UPDATES_KEY, JSON.stringify(storedLogs));

      const confirmationMessage = document.getElementById('confirmationMessage');
      confirmationMessage.style.display = "block";
      confirmationMessage.textContent = `Delivery confirmation submitted. Order ${orderId} marked as completed.`;
      setTimeout(() => {
        window.location.href = 'Tracking.html';
      }, 2000);

      document.getElementById('deliveryForm').reset();
      populateOrderDropdown();
    });

    populateOrderDropdown();
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
