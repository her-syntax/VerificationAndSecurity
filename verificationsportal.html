<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verification Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: white;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border-left: 20px solid teal;
      border-right: 20px solid rgb(255, 196, 0);
      background: white;
    }
    h2 {
      color: teal;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: teal;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 2px solid teal;
      background: white;
    }
    input[type="file"] {
      border: 2px solid yellow;
    }
    button {
      padding: 10px 20px;
      background: yellow;
      color: teal;
      font-weight: bold;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      font-weight: bold;
      color: teal;
      text-align: center;
    }

    .invoice {
      margin-top: 18px;
      border: 2px solid teal;
      border-radius: 8px;
      padding: 14px;
      display: none;
      background: #f7fffd;
    }

    .invoice h3 {
      margin-top: 0;
      color: teal;
    }

    .invoice-meta {
      margin-bottom: 10px;
      color: #0f766e;
      font-weight: bold;
    }

    .invoice table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 12px;
    }

    .invoice th,
    .invoice td {
      border: 1px solid #99d5cc;
      padding: 8px;
      text-align: left;
    }

    .invoice th {
      background: #e6faf5;
      color: teal;
    }

    .invoice-total {
      text-align: right;
      font-weight: bold;
      color: teal;
      margin: 0;
    }

    .invoice-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .invoice-actions button {
      width: auto;
      min-width: 150px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verification</h2>
    <form id="verificationForm">
      <label for="practiceNumber"> Please enter your HPCSA Registration or BHF Practice Number</label>
      <input type="text" id="practiceNumber" name="practiceNumber" required>

      <label for="documentUpload">Upload Registration Document</label>
      <input type="file" id="documentUpload" name="documentUpload" accept=".pdf,.jpg,.png" required>

      <button type="submit">Verify & Proceed</button>
      <div class="status" id="statusMessage"></div>

      <div class="invoice" id="invoicePanel">
        <h3>Invoice</h3>
        <div class="invoice-meta" id="invoiceMeta"></div>
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th>Qty</th>
              <th>Unit Price</th>
              <th>Line Total</th>
            </tr>
          </thead>
          <tbody id="invoiceBody"></tbody>
        </table>
        <p class="invoice-total" id="invoiceTotal"></p>
        <div class="invoice-actions">
          <button type="button" id="printInvoiceBtn">Print Invoice</button>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    let currentInvoiceData = null;

    function generateInvoiceNumber() {
      const stamp = Date.now().toString().slice(-6);
      return 'INV-' + stamp;
    }

    function renderInvoice(practiceNumber) {
      const invoicePanel = document.getElementById('invoicePanel');
      const invoiceMeta = document.getElementById('invoiceMeta');
      const invoiceBody = document.getElementById('invoiceBody');
      const invoiceTotal = document.getElementById('invoiceTotal');

      const rows = [
        {
          description: 'Verification Processing Fee',
          qty: 1,
          unitPrice: 450
        },
        {
          description: 'Compliance Document Review',
          qty: 1,
          unitPrice: 350
        }
      ];

      const grandTotal = rows.reduce(function(sum, row) {
        return sum + (row.qty * row.unitPrice);
      }, 0);

      const invoiceNumber = generateInvoiceNumber();
      const today = new Date().toLocaleDateString();
      invoiceMeta.textContent = 'Invoice No: ' + invoiceNumber + ' | Date: ' + today + ' | Client: ' + practiceNumber;

      currentInvoiceData = {
        invoiceNumber: invoiceNumber,
        date: today,
        client: practiceNumber,
        rows: rows,
        grandTotal: grandTotal
      };

      invoiceBody.innerHTML = '';
      rows.forEach(function(row) {
        const tr = document.createElement('tr');
        const lineTotal = row.qty * row.unitPrice;
        tr.innerHTML =
          '<td>' + row.description + '</td>' +
          '<td>' + row.qty + '</td>' +
          '<td>R ' + row.unitPrice.toFixed(2) + '</td>' +
          '<td>R ' + lineTotal.toFixed(2) + '</td>';
        invoiceBody.appendChild(tr);
      });

      invoiceTotal.textContent = 'Total: R ' + grandTotal.toFixed(2);
      invoicePanel.style.display = 'block';
    }

    function hideInvoice() {
      document.getElementById('invoicePanel').style.display = 'none';
      currentInvoiceData = null;
    }

    function generateInvoicePdf(invoiceData) {
      const jsPDF = window.jspdf.jsPDF;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.text('Invoice', 14, 18);

      doc.setFontSize(12);
      doc.text('Invoice No: ' + invoiceData.invoiceNumber, 14, 30);
      doc.text('Date: ' + invoiceData.date, 14, 38);
      doc.text('Client: ' + invoiceData.client, 14, 46);

      let y = 60;
      doc.setFont(undefined, 'bold');
      doc.text('Description', 14, y);
      doc.text('Qty', 110, y);
      doc.text('Unit Price', 130, y);
      doc.text('Line Total', 170, y);
      doc.setFont(undefined, 'normal');

      y += 8;
      doc.line(14, y - 4, 195, y - 4);

      invoiceData.rows.forEach(function(row) {
        const lineTotal = row.qty * row.unitPrice;
        doc.text(row.description, 14, y);
        doc.text(String(row.qty), 110, y);
        doc.text('R ' + row.unitPrice.toFixed(2), 130, y);
        doc.text('R ' + lineTotal.toFixed(2), 170, y);
        y += 8;
      });

      y += 4;
      doc.line(14, y - 2, 195, y - 2);
      doc.setFont(undefined, 'bold');
      doc.text('Total: R ' + invoiceData.grandTotal.toFixed(2), 140, y + 8);

      const fileName = invoiceData.invoiceNumber + '.pdf';
      doc.save(fileName);
    }

    document.getElementById('verificationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const practiceNumber = document.getElementById('practiceNumber').value;
      const file = document.getElementById('documentUpload').files[0];
      const statusMessage = document.getElementById('statusMessage');

      if (!practiceNumber || !file) {
        statusMessage.textContent = "Please provide all required information.";
        return;
      }

      statusMessage.textContent = "Verifying...";

      // Simulated API call
      setTimeout(() => {
        if (practiceNumber.startsWith("HPCSA") || practiceNumber.startsWith("BHF")) {
          statusMessage.textContent = "Verification successful. Invoice can now be generated.";
          renderInvoice(practiceNumber);
        } else {
          statusMessage.textContent = "Verification failed. Please check your details.";
          hideInvoice();
        }
      }, 2000);
    });

    document.getElementById('printInvoiceBtn').addEventListener('click', function() {
      if (!currentInvoiceData) {
        alert('Please complete verification first to generate the invoice PDF.');
        return;
      }
      generateInvoicePdf(currentInvoiceData);
    });
  </script>
</body>
</html>
